<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>🧑‍💼 Employee Management System</h1>
            <button id="load-api-btn" class="api-btn">Load API Demo Data</button>
        </header>

        <!-- ADD/EDIT FORM -->
        <section class="form-section">
            <h2 id="form-title">Add Employee</h2>
            <form id="employee-form">
                <input type="hidden" id="edit-id">
                <input type="text" id="name" placeholder="Name" required>
                <input type="text" id="department" placeholder="Department" required>
                <input type="number" id="salary" placeholder="Salary" required>
                <button type="submit" id="submit-btn">Add Employee</button>
                <button type="button" id="cancel-edit-btn" class="hidden">Cancel Edit</button>
            </form>
        </section>

        <!-- CONTROLS -->
        <section class="controls-section">
            <input type="text" id="search-input" placeholder="Search by name...">
            
            <select id="filter-dept">
                <option value="All">All Departments</option>
            </select>
            
            <select id="sort-salary">
                <option value="none">Sort: Salary</option>
                <option value="asc">Low to High ↑</option>
                <option value="desc">High to Low ↓</option>
            </select>
        </section>

        <!-- DATA LIST -->
        <section class="list-section">
            <div id="employee-list">
                <!-- JavaScript renders employees here -->
            </div>
        </section>

        <!-- STATS -->
        <section class="stats-section">
            <h3>Average Salary: <span id="avg-salary">₹0</span></h3>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
